name: Prepare tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  release:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Prepare release runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - run: python3 tools/fetch_ci_api.py
      - name: Build versioned release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IJ_JAR: ${{ github.workspace }}/.deps/ij-1.54p.jar
        run: python3 tools/release.py --tag "$RELEASE_TAG"
      # A maintainer reviews and publishes the draft; tags alone do not claim stability.
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Microscopio Color $RELEASE_TAG" \
            --notes-file docs/RELEASE-NOTES.md \
            release/*.jar release/*.tar.gz release/SHA256SUMS.txt
