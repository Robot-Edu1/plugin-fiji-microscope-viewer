name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Dependencies belong to the disposable CI runner, never to a pupil's laptop.
      - name: Prepare test runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Fetch pinned ImageJ API for compilation
        run: python3 tools/fetch_ci_api.py
      - name: Build and run synthetic tests
        env:
          IJ_JAR: ${{ github.workspace }}/.deps/ij-1.54p.jar
        run: |
          make test
          python3 tools/test.py --slow-encoder
