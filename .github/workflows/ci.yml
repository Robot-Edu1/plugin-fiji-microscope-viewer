name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        java: ['11', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Dependencies belong to the disposable CI runner, never to a pupil's laptop.
      - name: Prepare test runner
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Fetch pinned ImageJ API for compilation
        run: python3 tools/fetch_ci_api.py
      - name: Build and run synthetic tests
        env:
          IJ_JAR: ${{ github.workspace }}/.deps/ij-1.54p.jar
        run: make test
